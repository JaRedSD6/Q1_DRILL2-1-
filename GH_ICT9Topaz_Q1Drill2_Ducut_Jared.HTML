<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
    body{
        color: rgb(23, 23, 40);
        background-color: rgb(133, 162, 220);
        margin: auto;
    }
    H1{
        background-color: rgb(49, 61, 101);
        color: rgb(255, 255, 255);
        text-align: center;
    }
    div{
        border: 1px solid rgb(19, 18, 43);
        border-radius: 4px;
        box-shadow: 10px 10px 25px 11px rgba(9,38,51,0.75);
        -webkit-box-shadow: 10px 10px 25px 11px rgba(9,38,51,0.75);
        -moz-box-shadow: 10px 10px 25px 11px rgba(9,38,51,0.75);
        padding: 10px;
        width: 80%;
        margin: 10%;
    }
    p{
        text-align: center;
        background-color: rgb(99, 143, 215);
        color: rgb(255, 255, 255);
    }

    textarea{
        width: 100%;
    }
    .button{
        width: 100%;
    }
    .title{
        width: 100%;
    }
    img{
        width: 30%;
        text-align: center;
    }
</style>
</head> 

<body>

    <h1>Rate a Movie</h1>
 <p> Share your Top movie and write a review</p>
 
 <div>
<center>
    <img src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcTZAj5lNPOMUMlFc5Pf5gpIERK8bXd6T1sFvwIAwAqgm-Z9Hb7U" alt="Movie">
</center>
<form action="">
<input type="text" placeholder="Enter movie title" class="title">
            <fieldset>
            <legend>Genre (select all that apply)</legend>
                
                <input type="checkbox"> 
                <label>Drama</label>
                
                <input type="checkbox"> 
                <label>Action</label>
                
                <input type="checkbox"> 
                <label>Comedy</label>

                <input type="checkbox"> 
                <label>Fantasy</label>

                <input type="checkbox"> 
                <label>Sci-Fi</label>
            </fieldset>

            <fieldset>
            <legend>Rating</legend>
                <input type="Radio" name="Rating"> 
                <label>⭐</label>

                <input type="Radio" name="Rating"> 
                <label>⭐⭐</label>

                <input type="Radio" name="Rating"> 
                <label>⭐⭐⭐</label>

                <input type="Radio" name="Rating"> 
                <label>⭐⭐⭐⭐</label>

                <input type="Radio" name="Rating"> 
                <label>⭐⭐⭐⭐⭐</label>
            </fieldset>

            <fieldset>
             <textarea name="Write" placeholder="Write your review"></textarea>
            </fieldset>

           <fieldset>
            <input type="submit" value="Submit review" class="button" width="100%">
           </fieldset>

 </div>
 <p>Movie review tips: click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/">here</p>

</body>
</html>
